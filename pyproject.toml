[project]
name = "habitica-notion-sync"
version = "0.1.0"
description = "Daily sync of Habitica stats (dailies, habits, level, health, gold, streaks) into a Notion database."
readme = "README.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [
    { name = "Charlie2M", email = "212143584+Charlie2M@users.noreply.github.com" }
]
requires-python = ">=3.12"
dependencies = [
    "httpx>=0.28.1",
    "notion-client>=3.1.0",
    "pydantic>=2.14.1",
    "python-dotenv>=1.2.4",
    "pyyaml>=6.0.3",
    "tzdata>=2026.6",
]

[project.scripts]
hns = "hns.cli:main"

[build-system]
requires = ["uv_build>=0.13.6,<0.14.0"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = "hns"

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # pyflakes
    "I",   # isort
    "UP",  # pyupgrade
    "B",   # flake8-bugbear
    "SIM", # flake8-simplify
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra --strict-markers"

[dependency-groups]
dev = [
    "pytest>=9.1.1",
    "respx>=0.23.1",
    "ruff>=0.17.3",
]
